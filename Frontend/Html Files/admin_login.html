<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | DriveEase</title>
    <link rel="icon" type="image/png" href="../Images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Css Files/style.css">
</head>
<body data-page="adminlogin" class="">

    <div id="siteHeader"></div>


    <main class="auth-wrap">
        <section class="auth-card">
            <div class="auth-heading">
                <div class="auth-icon"><i class="fa-solid fa-user-shield"></i></div>
                <h1>Admin Login</h1>
                <p>Sign in to manage your DriveEase rental system.</p>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Email address</label>
                    <input type="email" id="adminEmail" class="form-control" placeholder="Enter admin email" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="adminPassword" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="adminPassword" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-block" id="adminLoginButton">Sign In</button>
                <p id="adminLoginMessage" class="message" role="status" aria-live="polite" style="margin-top:12px;text-align:center;"></p>
            </form>
            <div class="auth-footer">Authorized administrators only.</div>
        </section>
    </main>


    <div id="siteFooter"></div>

    <script src="../Javascript Files/main.js"></script>
    <script src="../Javascript Files/admin_login.js"></script>
</body>
</html>
