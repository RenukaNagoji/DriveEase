<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DriveEase</title>
    <link rel="icon" type="image/png" href="../Images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Css Files/style.css">
</head>
<body data-page="login" class="">

    <div id="siteHeader"></div>


    <main class="auth-wrap">
        <section class="auth-card">
            <div class="auth-heading">
                <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
                <h1>Welcome back!</h1>
                <p>Sign in to continue your journey with DriveEase.</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-block" id="loginButton">Sign In <i class="fa-solid fa-arrow-right"></i></button>
                <p id="loginMessage" class="message" role="status" aria-live="polite" style="margin-top:12px;text-align:center;"></p>
            </form>
            <div class="auth-footer">Don't have an account? <a href="register.html">Create an account</a></div>
        </section>
        <p class="auth-bottom">Your next journey is just a login away.</p>
    </main>


    <div id="siteFooter"></div>

    <script src="../Javascript Files/main.js"></script>
    <script src="../Javascript Files/login.js"></script>
</body>
</html>
