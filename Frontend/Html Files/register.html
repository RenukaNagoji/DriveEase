<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | DriveEase</title>
    <link rel="icon" type="image/png" href="../Images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Css Files/style.css">
</head>
<body data-page="login" class="">

    <div id="siteHeader"></div>


    <main class="auth-wrap">
        <section class="auth-card">
            <div class="auth-heading">
                <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
                <h1>Create your account</h1>
                <p>Join DriveEase and make your next journey easier.</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" class="form-control" rows="2" placeholder="Enter your address"></textarea>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" class="form-control" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
                    </div>
                    <small>Use at least 8 characters.</small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-block" id="registerButton">Create Account <i class="fa-solid fa-arrow-right"></i></button>
                <p id="registerMessage" class="message" role="status" aria-live="polite" style="margin-top:12px;text-align:center;"></p>
            </form>
            <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
        </section>
        <p class="auth-bottom">Your journey starts here. Ride with DriveEase.</p>
    </main>


    <div id="siteFooter"></div>

    <script src="../Javascript Files/main.js"></script>
    <script src="../Javascript Files/register.js"></script>
</body>
</html>
